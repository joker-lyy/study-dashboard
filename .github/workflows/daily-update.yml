name: 【学习看板】每日数据自动更新

on:
  # 北京时间 00:05 + 白天 10:05/13:05/16:05/19:05（每 3 小时）= UTC 16:05 + 02:05/05:05/08:05/11:05。
  # 2026-09-19 与 Rain 约定：电脑白天不常开 → 白天刷新全部放云端，不依赖任何电脑开机；
  # 本机看板管家的定时刷新保留作双保险（电脑开着时先刷，云端发现数据无变化会自动跳过）。
  schedule:
    - cron: "5 2,5,8,11,16 * * *"
  # Actions 页面可手动立即刷新
  workflow_dispatch:

# 同一时间只允许一轮刷新，避免数据文件互相覆盖。
concurrency:
  group: study-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 本地抓一轮约 7 分钟；云端从海外访问国内接口，实测 19~35 分钟且波动较大，给足余量。
    # 抓取步骤允许整轮重试一次，所以余量再放大（超时值只影响异常场景）。
    timeout-minutes: 150
    env:
      # 云端延迟大，把并发调高以缩短总时长（本机仍用脚本默认 8/3）
      STUDY_WORKERS: "16"
      STUDY_MAP_WORKERS: "6"
      # 2026-09-19 修复：runner 默认 UTC，fetch_study.py 的 generatedAt 曾慢 8 小时
      #（页面「数据更新于 08:20」实为北京时间 16:20）。设成北京时区后两端口径一致。
      TZ: Asia/Shanghai

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # fetch_study.py 只用 Python 标准库（urllib/hashlib/json），无需安装依赖。
      # 输出同时落 fetch.log，失败时由结尾的企微通知摘取原因。
      # 2026-09-18 事故：海外访问国内接口单次超时就把整轮搞崩 → 这里再加一道
      # 「整轮重试一次」的保险（脚本内部已有按请求重试，双层兜底）。
      - name: 抓取学习看板数据
        id: fetch
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2; do
            echo "===== 第 $attempt 次抓取 ====="
            if python fetch_study.py 2>&1 | tee fetch.log; then
              exit 0
            fi
            echo "!! 第 $attempt 次抓取失败，稍后重试"
            sleep 10
          done
          echo "!! 两次抓取均失败"
          exit 1

      # 抓取允许个别计划失败，但不允许"工作流成功、数据其实没更新"。
      - name: 校验抓取结果
        id: verify
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/data.json")
          if not p.exists():
              raise SystemExit("错误：未生成 data/data.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          plans = d.get("plans") or []
          ok = [x for x in plans if not x.get("fetchError")]
          bad = [x for x in plans if x.get("fetchError")]
          if not ok:
              raise SystemExit("校验失败：没有任何计划抓取成功")
          if len(bad) / max(len(plans), 1) > 0.3:
              raise SystemExit("校验失败：失败比例过高 %d/%d" % (len(bad), len(plans)))

          # 计划数会随平台自身增删大幅波动（2026-09-18 实测一天内 raw 31~70、过滤后 23~55，
          # 与是否并发抓数无关），所以这里只做「绝对塌陷」兜底，绝不按相对降幅拦截，
          # 否则正常的波动会被误拦、早上就没更新了。
          if len(plans) < 15:
              raise SystemExit("校验失败：计划数仅 %d 个，明显塌陷，拒绝发布" % len(plans))

          import subprocess
          try:
              old = json.loads(subprocess.check_output(
                  ["git", "show", "HEAD:data/data.json"]).decode("utf-8"))
              n_old = len(old.get("plans") or [])
          except Exception:
              n_old = 0
          if n_old and n_old != len(plans):
              print("提示：本次 %d 个计划（上一版 %d 个）——平台计划会随时增删，属正常波动"
                  % (len(plans), n_old))

          print("校验通过：成功 %d 个计划，失败 %d 个（上一版 %d 个）" % (len(ok), len(bad), n_old))
          print("generatedAt:", d.get("generatedAt"))
          print("data.json 大小: %d KB" % (p.stat().st_size // 1024))
          PY

      - name: 提交并发布数据
        id: publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "【学习看板】data: 云端每日自动更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"

          # 先提交本轮结果，再同步远端；若 data.json 有冲突，以本轮新抓的数据为准。
          if ! git pull --rebase origin main; then
            echo "rebase 冲突，改为以本轮新抓数据为准"
            git rebase --abort || true
            git fetch origin main
            git reset --soft origin/main
            git add data/data.json
            git commit -m "【学习看板】data: 云端每日自动更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          fi
          git push origin main
          echo "已发布，GitHub Pages 1-2 分钟后生效"

      # 无论成功失败都推企微，消息统一带【学习看板】标识，便于和其他看板区分。
      # webhook 存在仓库 Secret 里（仓库是公开的，绝不能写进本文件）。
      - name: 推送更新结果到企业微信
        if: always()
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: python notify_wecom.py --status "$JOB_STATUS"
